pluginManagement {
    repositories {
        // 官方源优先：GitHub runner 在境外，国内镜像（阿里云/华为云）反而慢或超时，
        // 会让依赖在镜像上「等不到」而被判缺失（KSP 2.3.4 插件曾因此解析失败）。
        // KSP 等 plugin marker 的权威源是 Gradle Plugin Portal / Maven Central，故它们最先。
        gradlePluginPortal()
        mavenCentral()
        google()
        // 国内镜像兜底（境外 runner 上通常用不到）
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // jitpack 放最前：com.github.* 优先从 jitpack 解析（Moriafly/CarGuo 等仅在 jitpack 上）；
        // 若 jitpack 404，则回退到下方通用镜像（bumptech.glide、jenly1314 等实际在 Maven Central 上）。
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        // 官方源优先：GitHub runner 在境外，国内镜像（阿里云/华为云）反而慢或超时，
        // 会让依赖在镜像上「等不到」而被判缺失。镜像移到末尾兜底。
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
                // Required for org.chromium.net:httpengine-native-provider
                includeGroup("org.chromium.net")
            }
        }
        mavenCentral()
        gradlePluginPortal()
        // 国内镜像兜底（境外 runner 上通常用不到）
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
    }
}
rootProject.name = 'legado'

include ':app'
include ':modules:book'
include ':modules:rhino'
