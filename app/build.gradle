// 版本名取「本次提交时间」而非当前时间（11-13 改）。
// 原实现用 new Date()，每小时都变；同一提交重跑打包会得到不同版本名，
// 而版本名会进合并后的 AndroidManifest，进而成为 R8 的输入之一，
// 导致 R8 永远无法命中 build cache（改前实测 R8 单步 433s，占整轮一半）。
// 改成提交时间后，同一提交的产物可复现，重跑打包能命中缓存。
// 精度到分钟（用户 11-13 指定），格式仍为 3.yy.MMddHHmm。
// 取不到 git 时（如无 .git 的源码包）退回当前时间，保证仍能构建。
static def releaseTime(File dir) {
    try {
        def raw = 'git log -1 --format=%ct'.execute(null, dir).text.trim()
        if (!raw.isEmpty()) {
            return new Date(Long.parseLong(raw) * 1000L).format("yy.MMddHHmm", TimeZone.getTimeZone("GMT+8"))
        }
    } catch (Exception ignored) {
    }
    return new Date().format("yy.MMddHHmm", TimeZone.getTimeZone("GMT+8"))
}

// 11-15 用户令：APK 文件名用「应用名_版本号」（对齐 UTTS 的 U-TTS-v<版本> 风格）。
// 应用名取 strings.xml 的 app_name（U阅），改应用名时包名跟着变，不用再改这里。
// 版本号仍 3.yy.MMddHHmm（提交时间，11-13 定）。
// 11-15 用户令：APK 文件名用「应用名_版本号」（对齐 UTTS 的 U-TTS-v<版本> 风格）。
// 首版用中文「U阅」，真机下载后文件名被浏览器/下载器把非 ASCII 字符洗成「U.」
//（截图实锤）→ 改纯 ASCII「Uyue」。版本号仍 3.yy.MMddHHmm（提交时间，11-13 定）。
def name = "Uyue"
def version = "3." + releaseTime(rootDir)
def gitCommitsText = 'git rev-list HEAD --count'.execute(null, rootDir).text.trim()
def gitCommits = gitCommitsText.isEmpty() ? 0 : Integer.parseInt(gitCommitsText)

android {
    compileSdk 36
    ndkVersion "25.2.9519653"
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "com.legado.app"
        // httpengine-native-provider requires minSdkVersion >= 23
        // (it declares minSdkVersion=23 in its own AndroidManifest.xml).
        minSdk 23
        targetSdk 36
        versionCode Math.max(37499, 30000 + gitCommits)
        versionName version
        // 只保留 64 位 ARM（用户的骁龙 8s Gen 3 为 arm64-v8a）：mobile-ffmpeg 默认带
        // 4 种 ABI，全打包会让 APK 多出 ~24M；本机自用不需要模拟器/32 位兼容
        ndk {
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            }
            applicationIdSuffix '.release.u'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name")
            applicationIdSuffix '.debug.u'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            // 11-15 用户令：命名格式 = 应用名_版本号.apk（U阅_3.26.11150449.apk）。
            // 原 ${name}_${flavor}_... 里的 flavor 段（恒为 "app"）与格式冲突，去掉；
            // 只有一个 flavor，去掉后文件名反而干净。
            outputFileName = "${name}_${defaultConfig.versionName}.apk"
        }
    }


    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = false
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources.excludes.add('META-INF/*')
        // 不压缩任何文件
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        // Release 构建不再跑 lintVital：AGP 默认在 assembleRelease 时强制 lint，
        // 加上下面的 checkDependencies=true 会把 book/rhino 与全部 aar 依赖一起分析。
        // 实测（run 43319578737，23m05s）lintVitalAnalyze 12m15s + lintVital 3m32s，
        // 占掉整个打包 2/3 时间，而本项目自 10-09 起从未被它拦下过。
        // 需要 lint 时手动跑 `./gradlew :app:lintAppRelease`。
        checkReleaseBuilds false
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
}

