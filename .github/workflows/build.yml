name: 打包

# 运行记录标题：先占位，等 APK 产出后由最后一步改成实际版本号（如「打包 3.26.111218」）。
# 版本号取自编译时刻（app/build.gradle 的 version = "3." + yy.MMddHH），
# 只有构建完才能知道，所以不能在 run-name 里直接算。
run-name: 打包 ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 最后一步要用 API 改运行记录名，需要 actions: write
      actions: write
    env:
      outputs_dir: "${{ github.workspace }}/app/build/outputs"

    steps:
      - uses: actions/checkout@v4

      # Java 21: app/build.gradle sourceCompatibility/targetCompatibility = VERSION_21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK 36 (compileSdk/targetSdk = 36) + build-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      # Signing key (release-testkey.jks) and passwords are committed in-repo
      # (gradle.properties), so no GitHub Secrets are needed.
      # Only inject the SDK path into local.properties as a fallback.
      - name: Init local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --build-cache --parallel --daemon --warning-mode all

      - name: Get version name
        run: |
          ls -la ${{ env.outputs_dir }}/apk/app/release/
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/app/release/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "Uyue_${{ env.ver_name }}"
          path: ${{ env.outputs_dir }}/apk/app/release/*.apk
          retention-days: 30

      # 把运行记录标题改成实际版本号，列表里一眼认出是哪一版（打包 3.26.111218）。
      # 这一步失败不影响产物，故 continue-on-error。
      - name: Rename run to version
        if: env.ver_name != ''
        continue-on-error: true
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "{\"name\": \"打包 ${{ env.ver_name }}\"}"
          echo "run renamed to: 打包 ${{ env.ver_name }}"
