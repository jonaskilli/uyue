name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      outputs_dir: "${{ github.workspace }}/app/build/outputs"

    steps:
      - uses: actions/checkout@v4

      # Java 21: app/build.gradle sourceCompatibility/targetCompatibility = VERSION_21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK 36 (compileSdk/targetSdk = 36) + build-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      # Signing key (release-testkey.jks) and passwords are committed in-repo
      # (gradle.properties), so no GitHub Secrets are needed.
      # Only inject the SDK path into local.properties as a fallback.
      - name: Init local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --build-cache --parallel --daemon --warning-mode all

      - name: Get version name
        run: |
          ls -la ${{ env.outputs_dir }}/apk/app/release/
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/app/release/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "Uyue_${{ env.ver_name }}"
          path: ${{ env.outputs_dir }}/apk/app/release/*.apk
          retention-days: 30

      # 发布到 Releases：此前只上传 artifact（30 天过期且要登录才能下），
      # Releases 页一直是空的。这里补上，每次打包都生成一个可直接下载的 Release。
      # 版本号作标签名，与前几次打包的命名口径一致。
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.ver_name }}
          tag_name: ${{ env.ver_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.outputs_dir }}/apk/app/release/*.apk
          draft: false
          prerelease: false
          # 不生成自动 changelog（Release 页只留 APK，说明看提交历史）
          generate_release_notes: false

