name: Build U阅 Release

on:
  # 手动触发：在 Actions 页面点 Run workflow 即可出包
  workflow_dispatch:
  # 推 v* 标签也自动出包
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      outputs_dir: "${{ github.workspace }}/app/build/outputs"

    steps:
      - uses: actions/checkout@v4

      # Java 21：app/build.gradle 的 sourceCompatibility/targetCompatibility = VERSION_21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK 36（compileSdk/targetSdk 均为 36）+ build-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      # 签名密钥 release-testkey.jks 与密码已在仓内（gradle.properties），无需 Secrets。
      # 仅补 local.properties 里的 SDK 路径（AGP 也认 ANDROID_HOME，双保险）。
      - name: Init local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --build-cache --parallel --daemon --warning-mode all

      - name: Get version name
        run: |
          ls -la ${{ env.outputs_dir }}/apk/app/release/
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/app/release/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "U阅_${{ env.ver_name }}"
          path: ${{ env.outputs_dir }}/apk/app/release/*.apk
          retention-days: 30
