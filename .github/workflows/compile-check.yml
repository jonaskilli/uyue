name: Build Test

# 只编译、不出包（10-12 加）：改完 Kotlin 先过这一步（约 3~6 分钟），
# 绿了再手动触发「Build Release」（17~25 分钟）。
# 起因：10-12 两次「直接打包才发现编译错」，白烧两轮 17~25 分钟。
#
# 与 build.yml 完全同一套环境（Java 21 / Android SDK 36 / local.properties），
# 只是把 assembleAppRelease 换成「编译 Kotlin + 打包资源」。
#
on:
  push:
    branches:
      - master
    # 只在这些路径变动时才编译：文档、workflow 自身、仓库说明类的改动不必烧一次构建。
    # 拿不准时用 workflow_dispatch 手动补跑。
    paths:
      - 'app/**'
      - 'modules/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  # job id 必须与 build.yml 的 build 一致：gradle/actions/setup-gradle 的缓存键是
  #   ${os}|${job-id}[${hash(工作流名+矩阵)}]-${sha}
  # 恢复时第一层要求工作流名也一致，但第三层兜底只看「OS + job id」。
  # 两边都叫 build，编译检查刚跑出的增量成果，打包时就能按第三层直接复用；
  # 叫 compile 时两棵缓存树互不相认，打包只能恢复到旧提交，KSP+Kotlin 白跑约 4 分钟。
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 21: app/build.gradle sourceCompatibility/targetCompatibility = VERSION_21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK 36 (compileSdk/targetSdk = 36) + build-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Init local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Compile Kotlin (release)
        run: |
          chmod +x gradlew
          ./gradlew :app:compileAppReleaseKotlin :app:processAppReleaseResources \
            --build-cache --parallel --daemon --warning-mode all

      # 11-21 加：本地 JVM 单测（proot 环境跑不了 testAppDebugUnitTest 的资源合并，
      # AAPT2 守护进程起不来；桌面 runner 无此限制）。当前覆盖标注缓存重排
      # DialogCacheRealignment（符号改动/引号增删/重复台词/无变化四类用例）。
      - name: Unit tests (JVM)
        run: |
          chmod +x gradlew
          ./gradlew :app:testAppDebugUnitTest --build-cache --parallel --daemon \
            --warning-mode all

