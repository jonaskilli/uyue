name: 编译

# 标题 = 编译 · 版本号·提交号。
# 版本号与打包同源（app/build.gradle：3.yy.MMddHH，取编译时刻），编译时同样要等
# 构建完才知道，故先放提交号占位，编译结束后由最后一步改成 编译 3.26.111218·b173e7d。
run-name: 编译 · ${{ github.sha }}

# 只编译、不出包（10-12 加）：改完 Kotlin 先过这一步（约 3~6 分钟），
# 绿了再手动触发「打包」（17~25 分钟）。
# 起因：10-12 两次「直接打包才发现编译错」，白烧两轮 17~25 分钟。
#
# 与 build.yml 完全同一套环境（Java 21 / Android SDK 36 / local.properties），
# 只是把 assembleAppRelease 换成「编译 Kotlin + 打包资源」。
on:
  push:
    branches:
      - master
    # 只在这些路径变动时才编译：文档、workflow 自身、仓库说明类的改动不必烧一次构建。
    # 拿不准时用 workflow_dispatch 手动补跑。
    paths:
      - 'app/**'
      - 'modules/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 最后一步要用 API 改运行记录名，需要 actions: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      # Java 21: app/build.gradle sourceCompatibility/targetCompatibility = VERSION_21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK 36 (compileSdk/targetSdk = 36) + build-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Init local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Compile Kotlin (release)
        run: |
          chmod +x gradlew
          ./gradlew :app:compileAppReleaseKotlin :app:processAppReleaseResources \
            --build-cache --parallel --daemon --warning-mode all

      # 把标题换成「编译 3.26.111218·<短提交号>」，与打包的版本号口径一致。
      # 版本号取 app/build.gradle 同一条生成规则（编译时刻 yy.MMddHH），此处直接复算。
      - name: Rename run to version
        if: success()
        continue-on-error: true
        run: |
          VER="3.$(date +%y.%m%d%H)"
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "{\"name\": \"编译 $VER·$SHORT\"}"
          echo "run renamed to: 编译 $VER·$SHORT"
