name: 编译

# 运行记录标题：直接用触发这次编译的提交信息，列表里一眼看出改了哪块，
# 不再是「编译 #1 #2 #3」这种看不出内容的编号。
run-name: 编译 · ${{ github.event.head_commit.message || github.sha }}

# 只编译、不出包（10-12 加）：改完 Kotlin 先过这一步（约 3~6 分钟），
# 绿了再手动触发「打包」（17~25 分钟）。
# 起因：10-12 两次「直接打包才发现编译错」，白烧两轮 17~25 分钟。
#
# 与 build.yml 完全同一套环境（Java 21 / Android SDK 36 / local.properties），
# 只是把 assembleAppRelease 换成「编译 Kotlin + 打包资源」。
on:
  push:
    branches:
      - master
    # 只在这些路径变动时才编译：文档、workflow 自身、仓库说明类的改动不必烧一次构建。
    # 拿不准时用 workflow_dispatch 手动补跑。
    paths:
      - 'app/**'
      - 'modules/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 21: app/build.gradle sourceCompatibility/targetCompatibility = VERSION_21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK 36 (compileSdk/targetSdk = 36) + build-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Init local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Compile Kotlin (release)
        run: |
          chmod +x gradlew
          ./gradlew :app:compileAppReleaseKotlin :app:processAppReleaseResources \
            --build-cache --parallel --daemon --warning-mode all
